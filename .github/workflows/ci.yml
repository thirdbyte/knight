name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # No signing credentials here on purpose. A pull request from a fork
      # cannot read secrets, and this job does not need them: the debug build
      # signs itself, and the protocol tests are pure JVM.
      - name: Run the protocol tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug

      - name: Keep the APK for inspection
        uses: actions/upload-artifact@v4
        with:
          name: knight-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
