name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Refuse to run without signing credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. An unsigned APK cannot upgrade an installed build, so this stops here. See the CI section of README.md for the three secrets this needs."
            exit 1
          fi

      - name: Check the tag matches the build file
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | cut -d'"' -f2)
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME says $TAG but app/build.gradle.kts says $VERSION. Bump versionName and versionCode, commit, then retag."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > knight-release.jks
          umask 077
          {
            printf 'storeFile=knight-release.jks\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties

      - name: Run the protocol tests
        run: ./gradlew :app:testReleaseUnitTest

      - name: Build the release APK
        run: ./gradlew :app:assembleRelease

      - name: Verify it really is signed
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "knight-${{ env.version }}.apk"

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          files: knight-${{ env.version }}.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

      # The runner is ephemeral, but leaving a key on disk for later steps to
      # trip over is a bad habit whatever the runner does afterwards.
      - name: Shred the credentials
        if: always()
        run: rm -f knight-release.jks keystore.properties
